# Copy to ~/.dbt/profiles.yml (merge under the dbt_rabbit_samples key).
#
#   cp profiles.sample.yml ~/.dbt/profiles.yml
#
# Or set DBT_PROFILES_DIR to this directory for local testing only.

dbt_rabbit_samples:
  target: dev
  outputs:
    dev:
      type: rabbitbigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('GCP_DATASET', 'dbt_demo') }}"
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      threads: 4
      job_retries: 1
      timeout_seconds: 300
      rabbit_api_key: "{{ env_var('RABBIT_API_KEY') }}"
      rabbit_default_pricing_mode: "{{ env_var('RABBIT_DEFAULT_PRICING_MODE', 'on_demand') }}"
      rabbit_reservation_ids: "{{ env_var('RABBIT_RESERVATION_IDS', '') }}"

    prod:
      type: rabbitbigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('GCP_DATASET', 'dbt_demo') }}"
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      threads: 4
      job_retries: 1
      timeout_seconds: 3600
      rabbit_api_key: "{{ env_var('RABBIT_API_KEY') }}"
      rabbit_default_pricing_mode: "{{ env_var('RABBIT_DEFAULT_PRICING_MODE', 'on_demand') }}"
      rabbit_reservation_ids: "{{ env_var('RABBIT_RESERVATION_IDS', '') }}"
